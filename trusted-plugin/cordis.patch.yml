# cordis.patch.yml — the layer applied when a profile lists this bundle
#
# The `name` field MUST match what `install.ps1` writes into the profile's
# own `cordis.patch.yml` (the npm-alias short name `minimax-usage`). If it
# were the full scoped name `@floatingdeaming/minimax-usage` instead, DSH
# would try to create a junction node_modules/minimax-usage →
# @floatingdeaming/minimax-usage on top of the existing npm-alias directory,
# which is the destructive failure mode documented in the README.
#
# The `id` is the plugin's stable identifier; `name` is what Node's module
# resolver finds at runtime (the npm alias directory has a name-shim
# package.json declaring `"name": "minimax-usage"`).

- insert:
    - id: minimax-usage
      name: minimax-usage